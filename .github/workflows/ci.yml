name: macOS checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Select Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy
      - name: Unit tests and lint
        run: |
          cargo +stable test --locked
          cargo +stable clippy --locked --all-targets -- -D warnings
      - name: Release build
        run: cargo +stable build --release --locked
      - name: Native integration tests
        run: |
          python3 tests/smoke.py target/release/jobq
          python3 tests/mcp.py target/release/jobq
          python3 tests/process_tree.py target/release/jobq
          python3 tests/maintenance.py target/release/jobq
          python3 tests/legacy_gate.py
          python3 tests/wait_many.py target/release/jobq
