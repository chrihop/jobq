[package]
name = "jobq"
version = "0.1.0"
edition = "2021"
description = "Durable, resource-aware local job queues for AI agents on macOS and Linux"
license = "MIT"
repository = "https://github.com/chrihop/jobq"
readme = "README.md"
keywords = ["agents", "job-queue", "mcp", "scheduler", "linux"]
categories = ["command-line-utilities", "development-tools"]
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "config.example.toml", "benchmark-results.json", "mcp-benchmark-results.json", "tests/*.py", "scripts/*.py", "scripts/*.c", "scripts/*.example", "AGENTS.md", "rustfmt.toml"]

[workspace]

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
humantime = "2"
libc = "0.2"
rmcp = { version = "3.5.1", default-features = false, features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.4"
tokio = { version = "1", features = ["rt", "net", "time", "io-util", "macros", "signal"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
sha2 = "0.10"
subtle = "2"
toml = "0.9"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
dbus = { version = "0.9.12", features = ["vendored"] }

[profile.release]
lto = "thin"
strip = true
